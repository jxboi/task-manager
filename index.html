<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Tasks</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
    <script type="module" src="src/auth.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="title-row">
          <h1 class="title" id="app-title" tabindex="-1">Tasks</h1>
          <button class="icon-button add-toggle" id="add-toggle" type="button" aria-label="Add task" aria-expanded="false"
            aria-controls="add-form" hidden>
            <span class="icon-disc" aria-hidden="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></span>
            <span class="add-toggle-label" aria-hidden="true">New task</span>
          </button>
        </div>
        <div class="account" id="account" hidden>
          <button class="icon-button profile-button" id="profile-button" type="button" aria-label="Account"
            aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu">
            <span class="icon-disc" aria-hidden="true"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          </button>
          <div class="profile-menu" id="profile-menu" role="menu" aria-labelledby="account-name" hidden>
            <p class="account-name" id="account-name" role="none"></p>
            <button class="menu-item account-sign-out" id="account-sign-out" type="button" role="menuitem" tabindex="-1">Sign out</button>
          </div>
        </div>
      </header>
      <p class="visually-hidden" id="auth-status" role="status"></p>
      <div class="auth-loading" id="auth-loading" aria-busy="true"><p class="visually-hidden" hidden>Loading</p></div>
      <section class="auth-card" id="auth-retry" hidden>
        <p>Can't reach the server</p>
        <button class="auth-primary add-button" id="auth-retry-button" type="button">Try again</button>
      </section>

      <section id="auth-view" hidden>
        <div class="auth-card">
          <div class="auth-modes seg" role="radiogroup" aria-label="Account">
            <label><input type="radio" name="account-mode" value="signin" checked><span>Sign in</span></label>
            <label><input type="radio" name="account-mode" value="signup"><span>Create account</span></label>
          </div>
          <h2 class="auth-heading" id="auth-heading" tabindex="-1">Sign in</h2>
          <p class="auth-info" id="auth-info" role="status"></p>
          <form id="auth-form" method="post" novalidate>
            <div class="auth-error" id="auth-error" role="alert"><span id="auth-error-text"></span>
              <button class="auth-link" id="auth-error-action" type="button" hidden></button>
            </div>
            <div class="auth-field" id="auth-name-field" hidden>
              <label for="auth-name">Name</label>
              <input class="auth-input" id="auth-name" name="name" type="text" autocomplete="name" autocapitalize="words"
                enterkeyhint="next" maxlength="80" disabled>
              <p class="auth-field-error" id="auth-name-error" hidden></p>
            </div>
            <div class="auth-field">
              <label for="auth-email">Email</label>
              <input class="auth-input" id="auth-email" name="email" type="email" inputmode="email" autocomplete="email"
                autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
              <p class="auth-field-error" id="auth-email-error" hidden></p>
            </div>
            <div class="auth-field">
              <label for="auth-password">Password</label>
              <div class="auth-password">
                <input class="auth-input" id="auth-password" name="password" type="password" autocomplete="current-password"
                  autocapitalize="none" enterkeyhint="go" maxlength="128">
                <button class="auth-show" id="auth-show" type="button" aria-label="Show password" aria-pressed="false">Show</button>
              </div>
              <p class="visually-hidden" id="auth-password-hint" hidden>At least 12 characters</p>
              <p class="auth-field-error" id="auth-password-error" hidden></p>
            </div>
            <button class="auth-primary add-button" id="auth-submit" type="submit">
              <span class="auth-spinner" aria-hidden="true" hidden></span><span id="auth-submit-text">Sign in</span>
            </button>
            <div class="auth-alt" id="auth-alt" hidden>
              <p class="auth-or" aria-hidden="true">or</p>
              <button class="auth-secondary" id="auth-demo" type="button" hidden>
                <span class="auth-spinner" id="auth-demo-spinner" aria-hidden="true" hidden></span><span id="auth-demo-text">Continue as demo</span>
              </button>
            </div>
          </form>
        </div>
      </section>

      <div id="task-view" hidden>
        <div class="summary-row is-quiet" id="summary-row">
          <p class="summary" id="summary" aria-live="polite"></p>
          <button class="text-button clear-filters" id="clear-filters" type="button" aria-label="Clear filters" hidden>
Clear</button>
        </div>

        <form class="add-form" id="add-form" hidden>
          <div class="add-field">
            <label class="visually-hidden" for="new-todo">New task</label>
            <input class="add-input" id="new-todo" type="text" placeholder="New task" autocomplete="off" enterkeyhint="done"
              aria-describedby="hint-limit">
            <button class="add-button" id="add-button" type="submit" disabled>Add</button>
          </div>
        </form>
        <p class="add-error" id="hint-limit" hidden></p>

        <div class="auth-signout-note" id="auth-signout-note" hidden>
          <p class="sync-text" role="status">Couldn't sign out. Try again.</p>
          <button class="text-button sync-dismiss" id="auth-dismiss-note" type="button" aria-label="Dismiss sign-out error">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="sync-note" id="sync-note" role="alert" hidden>
          <span class="sync-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m2 2 20 20M5.78 5.78A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.31-.2M21.53 16.05A4.5 4.5 0 0 0 17.5 10h-1.79A7 7 0 0 0 9.26 5.05"/></svg>
          </span>
          <p class="sync-text" id="sync-text"></p>
          <button class="text-button sync-retry" id="sync-retry" type="button" hidden>Try again</button>
          <button class="text-button sync-dismiss" id="sync-dismiss" type="button" aria-label="Dismiss message">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="status" id="status" role="status">
          <div class="banner" id="banner" hidden>
            <span class="banner-icon" id="banner-icon"></span>
            <p class="banner-text" id="banner-text"></p>
            <button class="banner-dismiss" id="banner-dismiss" type="button" aria-label="Dismiss notifications notice">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <span class="visually-hidden" id="announcer"></span>
        </div>

        <div class="filter-wrap" id="filter-wrap" hidden>
          <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by tag"></div>
        </div>

        <ul class="todo-list" id="todo-list" hidden></ul>
        <span class="visually-hidden" id="reorder-hint">Drag to move, or use the up and down arrow keys.</span>

        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-page" aria-hidden="true"><i></i><i></i><i></i></div>
          <h2 class="empty-title">No tasks yet</h2>
          <p class="empty-hint">Add one with New task. Type #tags to put it on a shelf.</p>
        </div>
      </div>
    </main>

    <div class="reminder-layer" id="reminder-layer" hidden>
      <div class="reminder-scrim" id="reminder-scrim"></div>
      <div class="reminder-editor" id="reminder-editor" role="dialog" aria-modal="true">
        <span class="reminder-edge" id="reminder-start" tabindex="0"></span>
        <div class="reminder-grab" aria-hidden="true"></div>
        <div class="sheet-bar">
          <button class="text-button reminder-cancel" id="reminder-cancel" type="button">Cancel</button>
          <h2 class="reminder-title" id="reminder-title">Edit task</h2>
          <button class="text-button reminder-save" id="reminder-save" type="button">Save</button>
        </div>
        <div class="sheet-body" id="sheet-body">
          <div class="sheet-section" id="edit-text-field">
            <label class="reminder-label" for="edit-text">Task</label>
            <input class="reminder-control" id="edit-text" type="text" autocomplete="off" enterkeyhint="done">
          </div>
          <div class="sheet-section">
            <span class="reminder-label" id="edit-tags-label">Tags</span>
            <div class="edit-tags-row">
              <div class="edit-tags" id="edit-tags" role="group" aria-labelledby="edit-tags-label"></div>
              <button class="text-button tag-add" id="edit-tag-add" type="button">
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Add tag
              </button>
              <input class="tag-field" id="edit-tag-field" type="text" autocomplete="off" autocapitalize="none"
                enterkeyhint="done" aria-label="New tag" hidden>
            </div>
          </div>
          <div class="sheet-section">
            <div class="picker" id="picker">
              <div class="picker-row">
                <span class="picker-icon" aria-hidden="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
                <label class="picker-key" for="reminder-on">Reminder</label>
                <input class="switch" id="reminder-on" type="checkbox" role="switch">
              </div>
              <div class="picker-detail" id="picker-detail" hidden>
                <div class="picker-row">
                  <span class="picker-icon" aria-hidden="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
                  <span class="picker-key" id="reminder-date-key">Date</span>
                  <button class="picker-value" id="reminder-date-button" type="button" aria-expanded="false"
                    aria-controls="calendar" aria-labelledby="reminder-date-key reminder-date-value">
                    <span id="reminder-date-value"></span><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
                  </button>
                  <input class="visually-hidden" id="reminder-date" type="date" tabindex="-1" aria-hidden="true">
                </div>
                <div class="calendar" id="calendar" hidden>
                  <div class="cal-head">
                    <h3 class="cal-month" id="cal-month" aria-live="polite"></h3>
                    <button class="cal-nav" id="cal-prev" type="button" aria-label="Previous month"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
                    <button class="cal-nav" id="cal-next" type="button" aria-label="Next month"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
                  </div>
                  <div class="cal-weekdays" id="cal-weekdays" aria-hidden="true"></div>
                  <div class="cal-days" id="cal-days" role="group" aria-labelledby="cal-month"></div>
                </div>
                <div class="picker-row">
                  <span class="picker-icon" aria-hidden="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
                  <label class="picker-key" for="reminder-time">Time</label>
                  <input class="time-input" id="reminder-time" type="time">
                </div>
                <div class="picker-row">
                  <span class="picker-icon" aria-hidden="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>
                  <label class="picker-key" for="reminder-repeat">Repeat</label>
                  <select class="repeat-select" id="reminder-repeat">
                    <option value="none">Never</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                  </select>
                </div>
              </div>
            </div>
            <div aria-live="polite">
              <p class="reminder-message" id="reminder-message" hidden>
                <span class="reminder-message-icon" id="reminder-message-icon"></span>
                <span id="reminder-message-text"></span>
              </p>
            </div>
          </div>
          <div class="sheet-section">
            <button class="text-button task-delete" id="task-delete" type="button">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete task
            </button>
          </div>
          <span class="visually-hidden" id="reminder-announcer" aria-live="polite"></span>
        </div>
        <span class="reminder-edge" id="reminder-end" tabindex="0"></span>
      </div>
    </div>

    <template id="x-icon">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </template>

    <template id="repeat-icon">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
      </svg>
    </template>

    <template id="alert-icon">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/>
      </svg>
    </template>

    <template id="grip-icon">
      <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
        <circle cx="5.5" cy="3.5" r="1.25"/><circle cx="10.5" cy="3.5" r="1.25"/>
        <circle cx="5.5" cy="8" r="1.25"/><circle cx="10.5" cy="8" r="1.25"/>
        <circle cx="5.5" cy="12.5" r="1.25"/><circle cx="10.5" cy="12.5" r="1.25"/>
      </svg>
    </template>

    <template id="info-icon">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
    </template>
  </body>
</html>
