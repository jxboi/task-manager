<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main class="app">
      <h1 class="title">Tasks</h1>
      <div class="summary-row">
        <p class="summary" id="summary" aria-live="polite"></p>
        <button class="clear-filters" id="clear-filters" type="button" aria-label="Clear filters" hidden>
          <span class="clear-long">Clear filters</span><span class="clear-short">Clear</span>
        </button>
      </div>

      <form class="add-form" id="add-form">
        <label class="visually-hidden" for="new-todo">New task</label>
        <input class="add-input" id="new-todo" type="text" placeholder="Add a task…" autocomplete="off" aria-describedby="add-hint">
        <button class="add-button" id="add-button" type="submit" disabled>Add</button>
      </form>
      <p class="hint" id="add-hint">
        <span id="hint-default">Add tags with <code>#</code>, like <code>Pay rent #home</code></span>
        <span id="hint-auto" hidden></span>
      </p>

      <div class="status" id="status" role="status">
        <div class="banner" id="banner" hidden>
          <span class="banner-icon" id="banner-icon"></span>
          <p class="banner-text" id="banner-text"></p>
          <button class="banner-dismiss" id="banner-dismiss" type="button" aria-label="Dismiss">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <span class="visually-hidden" id="announcer"></span>
      </div>

      <div class="filter-wrap" id="filter-wrap" hidden>
        <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by tag"></div>
      </div>

      <ul class="todo-list" id="todo-list" hidden></ul>

      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3 8-8"/>
            <path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <h2 class="empty-title">No tasks yet</h2>
        <p class="empty-body">Add your first task above to get started.</p>
      </div>

      <p class="footer" id="footer" hidden></p>
    </main>

    <div class="reminder-layer" id="reminder-layer" hidden>
      <div class="reminder-scrim" id="reminder-scrim"></div>
      <div class="reminder-editor" id="reminder-editor" role="dialog">
        <span class="reminder-edge" id="reminder-start" tabindex="0" aria-hidden="true"></span>
        <div class="reminder-grab" aria-hidden="true"></div>
        <h2 class="reminder-title">Reminder</h2>
        <p class="reminder-for" id="reminder-for"></p>
        <div class="reminder-field">
          <label class="reminder-label" for="reminder-when">Date and time</label>
          <input class="reminder-control" id="reminder-when" type="datetime-local">
        </div>
        <div class="reminder-field">
          <label class="reminder-label" for="reminder-repeat">Repeat</label>
          <select class="reminder-control" id="reminder-repeat" aria-describedby="reminder-repeat-help">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
          <p class="reminder-help" id="reminder-repeat-help" hidden></p>
        </div>
        <div aria-live="polite">
          <p class="reminder-message" id="reminder-message" hidden>
            <span class="reminder-message-icon" id="reminder-message-icon"></span>
            <span id="reminder-message-text"></span>
          </p>
        </div>
        <p class="reminder-note">Reminders alert only while this page is open in a browser tab.</p>
        <div class="reminder-actions" id="reminder-actions">
          <button class="reminder-remove" id="reminder-remove" type="button" aria-label="Remove reminder">
            <span class="remove-short">Remove</span><span class="remove-long">Remove reminder</span>
          </button>
          <button class="reminder-cancel" id="reminder-cancel" type="button">Cancel</button>
          <button class="reminder-save" id="reminder-save" type="button">Save</button>
        </div>
        <span class="reminder-edge" id="reminder-end" tabindex="0" aria-hidden="true"></span>
      </div>
    </div>

    <template id="trash-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
      </svg>
    </template>

    <template id="x-icon">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </template>

    <template id="bell-icon">
      <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
    </template>

    <template id="repeat-icon">
      <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>
      </svg>
    </template>

    <template id="alert-icon">
      <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/>
      </svg>
    </template>

    <template id="info-icon">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
    </template>
  </body>
</html>
